[project]
name = "pokegarden"
version = "0.1.0"
description = "Assistente Pokémon com OpenAI Agents SDK + PokéAPI (Clean Architecture, TDD)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "openai>=1.40,<2.0",
    "openai-agents>=0.24,<1.0",
    "requests>=2.32,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "jsonschema>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
